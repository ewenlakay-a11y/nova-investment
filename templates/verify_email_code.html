<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Email verification | Nova Investment</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container"><div class="card formbox" style="max-width:520px;margin:40px auto"><div class="eyebrow">Secure access</div><h2>Verify your email</h2><p>A 6-digit code was sent to <b>{{ email }}</b>. It expires in 10 minutes.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label for="code">Verification code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required></div><button class="btn" type="submit">Verify code</button></form><form method="post" action="/resend-email-code" style="margin-top:12px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn secondary" type="submit">Resend code</button></form></div></main></body></html>
