<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | Nova Investment</title><link rel="stylesheet" href="/static/style.css"></head><body><nav class="nav"><div class="container navinner"><a class="brand" href="/">Nova <span>Investment</span></a><div class="navlinks"><a href="/">Home</a><a href="/plans">Plans</a><a href="/login">Sign in</a><a class="btn" href="/register">Sign up</a></div></div></nav>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="container"><div class="flash {{cat}}">{{msg}}</div></div>{% endfor %}{% endwith %}<main class="container"><div class="card formbox"><div class="eyebrow">Account recovery</div><h2>Reset password</h2><p class="muted">A reset code was sent to <b>{{email}}</b>.</p><form method="post"><div class="field"><label>6-digit reset code</label><input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div><div class="field"><label>New password</label><input type="password" name="password" minlength="8" required></div><button class="btn" style="width:100%">Reset password</button></form></div></main></body></html>
