<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}} | Nova Investment</title><link rel="stylesheet" href="/static/style.css"></head><body><nav class="nav"><div class="container navinner"><a class="brand" href="/">Nova <span>Investment</span></a><div class="navlinks"><a href="/">Home</a><a href="/plans">Plans</a><a href="/login">Sign in</a><a class="btn" href="/register">Sign up</a></div></div></nav>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="container"><div class="flash {{cat}}">{{msg}}</div></div>{% endfor %}{% endwith %}<main class="container"><div class="card formbox"><div class="eyebrow">Email security</div><h2>{{heading}}</h2><p class="muted">{{description}}</p><form method="post"><div class="field"><label>6-digit code</label><input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" minlength="6" required autofocus></div><button class="btn" style="width:100%">{{button}}</button></form><p class="muted" style="margin-top:16px;font-size:13px">Codes expire after 10 minutes.</p></div></main></body></html>
